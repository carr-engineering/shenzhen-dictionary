<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Shenzhen Dictionary</title>
    <meta name="description" content="Offline Chinese–English dictionary for Mandarin and Cantonese">
    <meta name="theme-color" content="#FAF7F1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#17140F" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SZ Dict">
    <link rel="preload" href="szdict.js" as="script">
    <!-- The Latin font (Source Sans 3, Compose resources): fetched beside the code, ready before the first frame. -->
    <link rel="preload" href="composeResources/com.szdict.app.resources/font/source_sans_3_regular.otf" as="fetch" crossorigin>
    <link rel="preload" href="composeResources/com.szdict.app.resources/font/source_sans_3_medium.otf" as="fetch" crossorigin>
    <link rel="preload" href="composeResources/com.szdict.app.resources/font/source_sans_3_semibold.otf" as="fetch" crossorigin>
    <link rel="preload" href="composeResources/com.szdict.app.resources/font/source_sans_3_bold.otf" as="fetch" crossorigin>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #faf7f1; }
        #loading {
            position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px; font: 15px system-ui, sans-serif; color: #6b665c; background: #faf7f1;
        }
        #loading .name { font-size: 22px; font-weight: 600; color: #2b2925; }
        #loading .bar { width: 160px; height: 3px; border-radius: 2px; background: #ddd7c9; overflow: hidden; }
        #loading .bar::after {
            content: ""; display: block; width: 40%; height: 100%; background: #a53a2b; border-radius: 2px;
            animation: slide 1.1s ease-in-out infinite;
        }
        @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        @media (prefers-color-scheme: dark) {
            html, body, #loading { background: #17140f; }
            #loading { color: #a39d90; }
            #loading .name { color: #ece8df; }
            #loading .bar { background: #37342f; }
        }
    </style>
</head>
<body>
<div id="loading" role="status">
    <div class="name" id="loading-name">Shenzhen Dictionary</div>
    <div class="bar"></div>
    <div id="loading-text">Loading…</div>
</div>
<noscript>Shenzhen Dictionary needs JavaScript and WebAssembly.</noscript>
<script>
(function () {
    // The app's name in the interface language (AppName.kt; UiLanguageSetting.resolve): the tab title
    // and the loading screen. The running app keeps the title in step with the setting.
    try {
        var ui = null;
        try { ui = localStorage.getItem('szdict.setting.ui_language'); } catch (e) {}
        var tag = (ui && ui !== 'system' ? ui : navigator.language || 'en').toLowerCase().replace(/_/g, '-').split('-');
        var name = ['zh', 'yue', 'cmn'].indexOf(tag[0]) < 0 ? 'Shenzhen Dictionary'
            : tag.indexOf('hant') >= 0 ? '深圳詞典' : tag.indexOf('hans') >= 0 ? '深圳词典'
            : tag.indexOf('tw') >= 0 || tag.indexOf('hk') >= 0 || tag.indexOf('mo') >= 0 || tag[0] === 'yue' ? '深圳詞典' : '深圳词典';
        document.title = name;
        document.getElementById('loading-name').textContent = name;
        if (name !== 'Shenzhen Dictionary') document.documentElement.lang = name === '深圳词典' ? 'zh-Hans' : 'zh-Hant';
    } catch (e) {}

    // The store worker starts with the page, beside the download of the app's code, and begins to
    // open — on a first visit, to download — the dataset the page is about to ask for (PERF-060).
    // Its events are kept until the app is there to read them.
    try {
        var mode = /^\/yue(\/|$)/.test(location.pathname) ? 'cantonese' : /^\/zh(\/|$)/.test(location.pathname) ? 'mandarin' : null;
        try { mode = mode || localStorage.getItem('szdict.setting.dictionary_mode'); } catch (e) {}
        var worker = new Worker('sqlite-worker.js', { type: 'module' });
        var events = [];
        worker.addEventListener('message', function (event) { if (event.data && event.data.id === -1) events.push(event.data); });
        worker.postMessage({ warm: 'data/' + (mode === 'cantonese' ? 'cantonese' : 'mandarin') + '.db' });
        window.szdictStore = { worker: worker, events: events };
    } catch (e) { /* the app starts its own worker */ }

    var started = false;
    function boot() {
        if (started) return;
        started = true;
        var script = document.createElement('script');
        script.src = 'szdict.js';
        document.body.appendChild(script);
    }
    var sw = navigator.serviceWorker;
    if (!sw) { boot(); return; }
    // A newer app shell that an earlier visit downloaded takes over now, before the app starts
    // (ARCH-145); otherwise the page starts with the shell it has.
    sw.getRegistration().then(function (registration) {
        if (registration && registration.waiting && sw.controller) {
            sw.addEventListener('controllerchange', function () { location.reload(); });
            registration.waiting.postMessage('activate');
            setTimeout(boot, 2000);
        } else boot();
    }, boot);
    window.addEventListener('load', function () { sw.register('sw.js').catch(function () {}); });
})();
</script>
</body>
</html>
